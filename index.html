<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000"><title>Satoshi Kitchen Ver.1</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif;user-select:none}button{font:inherit}#app{height:100vh;padding:2vh 2vw;display:flex;flex-direction:column;gap:2vh}header{height:15vh;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333;padding:0 1vw 1.5vh}#clock{font-size:10vw;font-weight:300;letter-spacing:-.05em}#seconds{font-size:4.7vw;opacity:.65;margin-left:.25em}#date{font-size:3vw;opacity:.75}main{flex:1;display:grid;grid-template-columns:1fr 1.08fr;gap:2vw;min-height:0}.panel{border:1px solid #292929;border-radius:16px;padding:2vh 1.6vw}.title{font-size:2.4vw;opacity:.6;margin-bottom:1.5vh}.quick{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1vw}.quickTimer{height:13vh;background:#111;border:1px solid #444;color:#fff;border-radius:14px;font-size:4.4vw}.quickTimer.running{background:#fff;color:#000}.small{display:block;font-size:1.5vw;opacity:.65}#normalDisplay{font-size:7vw;text-align:center;margin:1.5vh 0 2vh}.adjust{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw;margin-bottom:1.3vh}.adjust button,.controls button,.stopwatchBtns button{height:8.5vh;background:#111;border:1px solid #444;color:#fff;border-radius:12px;font-size:2.1vw}.controls{display:grid;grid-template-columns:1.35fr 1fr;gap:1vw}#startBtn{background:#fff;color:#000;font-weight:bold}#stopwatch{margin-top:2vh;padding-top:1.5vh;border-top:1px solid #292929}#swDisplay{font-size:4.5vw;text-align:center;margin:1vh 0}.stopwatchBtns{display:grid;grid-template-columns:1fr 1fr;gap:1vw}#message{position:fixed;inset:0;background:#fff;color:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:10;font-size:7vw;font-weight:bold}#message span{font-size:3vw;margin-top:2vh;font-weight:normal}
</style></head><body><div id="app"><header><div id="clock"><span id="hm">--:--</span><span id="seconds">--</span></div><div id="date">----</div></header><main><section class="panel"><div class="title">ワンタッチタイマー</div><div class="quick"><button class="quickTimer" data-sec="180"><span class="main">3分</span><span class="small">タップで開始</span></button><button class="quickTimer" data-sec="300"><span class="main">5分</span><span class="small">タップで開始</span></button><button class="quickTimer" data-sec="600"><span class="main">10分</span><span class="small">タップで開始</span></button><button class="quickTimer" data-sec="1800"><span class="main">30分</span><span class="small">タップで開始</span></button></div></section><section class="panel"><div class="title">ノーマルタイマー</div><div id="normalDisplay">05:00</div><div class="adjust"><button data-add="-60">−1分</button><button data-add="60">＋1分</button><button data-add="300">＋5分</button></div><div class="controls"><button id="startBtn">START</button><button id="resetBtn">RESET</button></div><div id="stopwatch"><div class="title">ストップウォッチ</div><div id="swDisplay">00:00.0</div><div class="stopwatchBtns"><button id="swStart">START</button><button id="swReset">RESET</button></div></div></section></main></div><div id="message">TIME UP!<span>画面をタップして止める</span></div><script>
(function(){var days=['日','月','火','水','木','金','土'];function two(n){return n<10?'0'+n:n}function clock(){var d=new Date();document.getElementById('hm').textContent=two(d.getHours())+':'+two(d.getMinutes());document.getElementById('seconds').textContent=two(d.getSeconds());document.getElementById('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+days[d.getDay()]+'）'}clock();setInterval(clock,250);
var ctx=null,alarmTimer=null,msg=document.getElementById('message');function beep(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.18;o.start();o.stop(ctx.currentTime+.22)}catch(e){}}function alarm(){msg.style.display='flex';beep();alarmTimer=setInterval(beep,650)}msg.onclick=function(){msg.style.display='none';if(alarmTimer){clearInterval(alarmTimer);alarmTimer=null}};
var qs=document.querySelectorAll('.quickTimer');for(var i=0;i<qs.length;i++){(function(b){var orig=+b.getAttribute('data-sec'),rem=orig,t=null,end=0;b.onclick=function(){if(t){clearInterval(t);t=null;rem=orig;b.className='quickTimer';b.querySelector('.main').textContent=(orig/60)+'分';b.querySelector('.small').textContent='タップで開始';return}beep();end=Date.now()+rem*1000;b.className='quickTimer running';function tick(){rem=Math.max(0,Math.ceil((end-Date.now())/1000));b.querySelector('.main').textContent=Math.floor(rem/60)+':'+two(rem%60);b.querySelector('.small').textContent='タップで取消';if(rem<=0){clearInterval(t);t=null;rem=orig;b.className='quickTimer';b.querySelector('.main').textContent=(orig/60)+'分';b.querySelector('.small').textContent='タップで開始';alarm()}}tick();t=setInterval(tick,250)}})(qs[i])}
var normal=300,nt=null,nend=0,nd=document.getElementById('normalDisplay'),start=document.getElementById('startBtn');function shown(){nd.textContent=Math.floor(normal/60)+':'+two(normal%60)}var adds=document.querySelectorAll('[data-add]');for(var j=0;j<adds.length;j++)adds[j].onclick=function(){if(nt)return;normal=Math.max(0,Math.min(35999,normal+(+this.getAttribute('data-add'))));shown();beep()};start.onclick=function(){if(nt){clearInterval(nt);nt=null;start.textContent='START';return}if(normal<=0)return;beep();nend=Date.now()+normal*1000;start.textContent='PAUSE';function tick(){normal=Math.max(0,Math.ceil((nend-Date.now())/1000));shown();if(normal<=0){clearInterval(nt);nt=null;start.textContent='START';alarm()}}tick();nt=setInterval(tick,250)};document.getElementById('resetBtn').onclick=function(){if(nt){clearInterval(nt);nt=null}normal=300;start.textContent='START';shown();beep()};
var run=false,st=0,elapsed=0,swt=null,sd=document.getElementById('swDisplay'),sb=document.getElementById('swStart');function shows(ms){var t=Math.floor(ms/100),x=t%10,s=Math.floor(t/10)%60,m=Math.floor(t/600);sd.textContent=two(m)+':'+two(s)+'.'+x}sb.onclick=function(){if(run){elapsed+=Date.now()-st;clearInterval(swt);run=false;sb.textContent='START';return}beep();run=true;st=Date.now();sb.textContent='STOP';swt=setInterval(function(){shows(elapsed+Date.now()-st)},100)};document.getElementById('swReset').onclick=function(){if(run){clearInterval(swt);run=false}elapsed=0;shows(0);sb.textContent='START';beep()}})();
</script></body></html>
